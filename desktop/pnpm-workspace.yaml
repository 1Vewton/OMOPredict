# pnpm 11 配置：esbuild 的原生二进制由 optionalDependencies（@esbuild/win32-x64 等）提供，
# postinstall 仅做校验，因此**故意跳过**该构建脚本以保持确定性（与 frontend/pnpm-workspace.yaml 一致）。
allowBuilds:
  # electron-builder 的 Squirrel.Windows 依赖带 postinstall；本项目只打 nsis + zip，
  # 不需要它。pnpm 会把未表态的条目写成占位符并让 install 以退出码 1 结束、
  # 进而让 `pnpm exec` 拒绝运行（实测），所以这里显式表态。
  electron-winstaller: false
  esbuild: false

# 上游缺陷绕行（2026-11 实测）：app-builder-lib 26.18.0 声明 `@electron/get: ^3.0.0`，
# 但它的代码会读 `ElectronDownloadCacheMode.ReadWrite`，而该枚举**只在 3.1.0 起才有**
# （3.0.0 的导出里没有）。按 ^3.0.0 解析到 3.0.0 时，electron-builder 在
# "下载 Electron 制品" 这一步直接崩：
#   ⨯ Cannot read properties of undefined (reading 'ReadWrite')
#     at resolveCacheMode (.../app-builder-lib/out/util/electronGet.js:76)
# 这是 electron-builder 自 26.x 起的依赖声明缺陷，与本机环境无关。
# 升到 3.1.0 即修复；锁在这里（而不是依赖"偶然解析到高一点的补丁版"）是为了让安装可复现。
overrides:
  '@electron/get': 3.1.0
