# CI —— Python 数据科学层（M0 起）+ Go 中间层（M3 起）+ 前端（M4 起）+ 桌面 Host 层（T6 起）
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  engine:
    name: Python (ruff + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "engine/uv.lock"

      # 严格使用 uv.lock（--frozen：锁文件与 pyproject 不一致时直接失败）
      # --all-extras：测试覆盖 api（FastAPI/pydantic）、neural（torch）、plot（matplotlib）
      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Lint (ruff)
        run: uv run ruff check src tests

      - name: Test (pytest)
        run: uv run pytest -q

      - name: CLI smoke
        run: uv run omo-cli --version

  go:
    name: Go (fmt + vet + build + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true

      - name: Format check (gofmt)
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "未通过 gofmt 的文件："
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

  frontend:
    name: Frontend (lint + test + type-check + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # vitest（jsdom）：传输抽象/端点映射/401 横切/能力门禁/路由守卫/历史页删除
      - name: Test (vitest)
        run: pnpm test

      - name: Type-check & build
        run: pnpm build

  # 桌面 Host 层（T6）。用例会真拉起子进程（假后端 fixture 走真管道），
  # 真实后端+引擎的集成测试由 OMO_BACKEND_EXE 门控，CI 上默认跳过（见 desktop/README.md）。
  desktop:
    name: Desktop host (type-check + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm type-check

      # 编译产物必须真的能产出：main 走 ESM、preload 走 CJS（沙箱化 preload 只能 CJS）
      - name: Build (main = ESM, preload = CJS)
        run: pnpm build

      - name: Test (vitest)
        run: pnpm test

  # 打包脚本（T8）：脚本本身也要有 CI 覆盖，否则它们只会在发版当天第一次运行。
  # 这里用"桩壳目录"替代 electron-builder 的产物，从而在不下载 Electron 二进制的前提下
  # 跑通 build-lite 的完整路径（暂存 → 体积门禁 → 压缩），并验证两条失败路径。
  packaging:
    name: Packaging scripts (lightweight package)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Build renderer
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Stand-in shell tree
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path packaging/stand-in-shell/resources | Out-Null
          Set-Content -LiteralPath packaging/stand-in-shell/OMOPredict.exe -Value 'stand-in for the electron shell' -Encoding ASCII

      # 完整路径：Go 构建 → 暂存 → 体积门禁 → 压缩（退出码 0）
      - name: Build lightweight package
        shell: pwsh
        run: |
          pwsh -NoProfile -File ./scripts/build-lite.ps1 -AllowMissingShell -SkipFrontendBuild -ShellDir packaging/stand-in-shell
          if ($LASTEXITCODE -ne 0) { throw "build-lite.ps1 failed with exit code $LASTEXITCODE" }

      # 体积门禁必须真的会拦（否则门禁形同虚设）。
      # 末尾的 exit 0 是必须的：GitHub 的 pwsh 包装器用最后的 $LASTEXITCODE 决定本步退出码，
      # 而我们刚刚**故意**让子进程退出 1 —— 不显式清零，这一步就会被判为失败。
      - name: Size gate must trip when the limit is lowered
        shell: pwsh
        run: |
          pwsh -NoProfile -File ./scripts/build-lite.ps1 -AllowMissingShell -SkipFrontendBuild -SkipGoBuild -ShellDir packaging/stand-in-shell -PayloadLimitMB 1
          if ($LASTEXITCODE -ne 1) { throw "expected the size gate to exit 1, got $LASTEXITCODE" }
          exit 0

      # T8 验收项"无 Python 错误路径"：没有可用引擎时必须退出 1 并给出可操作指引，
      # 而不是抛一段 PowerShell 堆栈。CI 上（未安装引擎）正好就是这个状态。
      # 同样以 exit 0 收尾：这一步期望子进程退出 1。
      - name: Engine error path must be actionable
        shell: pwsh
        run: |
          $output = pwsh -NoProfile -File ./scripts/setup-engine.ps1 -SkipInstall 2>&1 | Out-String
          if ($LASTEXITCODE -ne 1) { throw "expected setup-engine.ps1 to exit 1 without an engine, got $LASTEXITCODE" }
          if ($output -notmatch 'What to check') { throw "setup-engine.ps1 did not print the guidance block:`n$output" }
          exit 0

      # 调试 CLI 必须真的能跑通协议（上一步已产出 desktop/release/omopredict-server.exe）
      - name: rpc-cli smoke (ping over stdio)
        shell: pwsh
        run: |
          $output = pwsh -NoProfile -File ./scripts/rpc-cli.ps1 -Exe ./desktop/release/omopredict-server.exe -DataDir ./ci-data -Method ping 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0) { throw "rpc-cli.ps1 exited $LASTEXITCODE`n$output" }
          if ($output -notmatch '"status"\s*:\s*"ok"') { throw "rpc-cli.ps1 got no ping response:`n$output" }
          exit 0

      # 未知方法必须回保留错误码 -32601（协议层错误不能被吞掉）
      - name: rpc-cli surfaces unknown methods
        shell: pwsh
        run: |
          $output = pwsh -NoProfile -File ./scripts/rpc-cli.ps1 -Exe ./desktop/release/omopredict-server.exe -DataDir ./ci-data -Method no.such.method 2>&1 | Out-String
          if ($output -notmatch '\-32601') { throw "expected error code -32601:`n$output" }
          exit 0

