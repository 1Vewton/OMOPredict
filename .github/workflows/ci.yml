# CI —— Python 数据科学层（M0 起）+ Go 中间层（M3 起）+ 前端（M4 起）+ 桌面 Host 层（T6 起）
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  engine:
    name: Python (ruff + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "engine/uv.lock"

      # 严格使用 uv.lock（--frozen：锁文件与 pyproject 不一致时直接失败）
      # --all-extras：测试覆盖 api（FastAPI/pydantic）、neural（torch）、plot（matplotlib）
      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Lint (ruff)
        run: uv run ruff check src tests

      - name: Test (pytest)
        run: uv run pytest -q

      - name: CLI smoke
        run: uv run omo-cli --version

  go:
    name: Go (fmt + vet + build + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true

      - name: Format check (gofmt)
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "未通过 gofmt 的文件："
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

  frontend:
    name: Frontend (lint + test + type-check + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # vitest（jsdom）：传输抽象/端点映射/401 横切/能力门禁/路由守卫/历史页删除
      - name: Test (vitest)
        run: pnpm test

      - name: Type-check & build
        run: pnpm build

  # 桌面 Host 层（T6）。用例会真拉起子进程（假后端 fixture 走真管道），
  # 真实后端+引擎的集成测试由 OMO_BACKEND_EXE 门控，CI 上默认跳过（见 desktop/README.md）。
  desktop:
    name: Desktop host (type-check + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm type-check

      - name: Test (vitest)
        run: pnpm test
