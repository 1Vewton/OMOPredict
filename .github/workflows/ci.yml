# CI —— Python 数据科学层（M0 起）+ Go 中间层（M3 起）+ 前端（M4 起）+ 桌面 Host 层（T6 起）
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  engine:
    name: Python (ruff + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "engine/uv.lock"

      # 严格使用 uv.lock（--frozen：锁文件与 pyproject 不一致时直接失败）
      # --all-extras：测试覆盖 api（FastAPI/pydantic）、neural（torch）、plot（matplotlib）
      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Lint (ruff)
        run: uv run ruff check src tests

      - name: Test (pytest)
        run: uv run pytest -q

      - name: CLI smoke
        run: uv run omo-cli --version

  go:
    name: Go (fmt + vet + build + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true

      - name: Format check (gofmt)
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "未通过 gofmt 的文件："
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

  frontend:
    name: Frontend (lint + test + type-check + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # vitest（jsdom）：传输抽象/端点映射/401 横切/能力门禁/路由守卫/历史页删除
      - name: Test (vitest)
        run: pnpm test

      - name: Type-check & build
        run: pnpm build

  # 桌面 Host 层（T6）。用例会真拉起子进程（假后端 fixture 走真管道），
  # 真实后端+引擎的集成测试由 OMO_BACKEND_EXE 门控，CI 上默认跳过（见 desktop/README.md）。
  desktop:
    name: Desktop host (type-check + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm type-check

      # 编译产物必须真的能产出：main 走 ESM、preload 走 CJS（沙箱化 preload 只能 CJS）
      - name: Build (main = ESM, preload = CJS)
        run: pnpm build

      - name: Test (vitest)
        run: pnpm test

  # 打包脚本（T8）：脚本本身也要有 CI 覆盖，否则它们只会在发版当天第一次运行。
  # 这里用"桩壳目录"替代 electron-builder 的产物，从而在不下载 Electron 二进制的前提下
  # 跑通 build-lite 的完整路径（暂存 → 体积门禁 → 压缩），并验证两条失败路径。
  packaging:
    name: Packaging scripts (lightweight package)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Build renderer
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Stand-in shell tree
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path packaging/stand-in-shell/resources | Out-Null
          Set-Content -LiteralPath packaging/stand-in-shell/OMOPredict.exe -Value 'stand-in for the electron shell' -Encoding ASCII

      # .ps1 一律 ASCII：中文 Windows 上 PowerShell 5.1 按 GBK 读脚本，CJK 注释的最后一个字节
      # 可能"吃掉"换行，把下一行代码吞进注释里 —— 而且 Parser::ParseFile 会报 0 个语法错误，
      # 直到真正执行才炸（HANDOVER 6.19）。CI 跑在 Linux/PS7 上不会复现，所以只能按字节查。
      - name: Scripts must be ASCII-only
        shell: pwsh
        run: |
          $bad = @()
          foreach ($file in Get-ChildItem -Path ./scripts -Filter *.ps1) {
            $bytes = [System.IO.File]::ReadAllBytes($file.FullName)
            $count = @($bytes | Where-Object { $_ -gt 127 }).Count
            if ($count -gt 0) { $bad += "$($file.Name): $count non-ASCII bytes" }
          }
          if ($bad.Count -gt 0) {
            throw ("These .ps1 files contain non-ASCII bytes; keep comments ASCII-only (see docs/HANDOVER.md 6.19):`n" + ($bad -join "`n"))
          }
          Write-Host 'all scripts are ASCII-only'
          exit 0

      # start-local.ps1 的参数解析与"可操作失败"路径：把脚本复制进一个空目录，frontend/ 与
      # server/ 都不存在，脚本必须退出 1 并打印 What to check（而不是抛 PowerShell 堆栈）。
      # 这样无需 pnpm/Go/Electron 就能覆盖它的失败路径。
      - name: start-local fails actionably without a renderer
        shell: pwsh
        run: |
          $tmp = Join-Path ([System.IO.Path]::GetTempPath()) 'omo-start-local-ci'
          if (Test-Path $tmp) { Remove-Item -Recurse -Force $tmp }
          New-Item -ItemType Directory -Force -Path (Join-Path $tmp 'scripts') | Out-Null
          Copy-Item ./scripts/start-local.ps1 (Join-Path $tmp 'scripts/start-local.ps1')
          $output = pwsh -NoProfile -File (Join-Path $tmp 'scripts/start-local.ps1') -SkipFrontendBuild 2>&1 | Out-String
          $code = $LASTEXITCODE
          if ($code -ne 1) { throw "expected start-local.ps1 to exit 1 without a renderer, got $code`n$output" }
          if ($output -notmatch 'What to check') { throw "start-local.ps1 printed no guidance block:`n$output" }
          exit 0

      # T9 发布清单：生成 → 校验通过 → 篡改后必须失败。
      # 只用桩文件，因此不需要 electron-builder 或 PyInstaller。
      - name: Release manifest round-trip
        shell: pwsh
        run: |
          $base = Join-Path ([System.IO.Path]::GetTempPath()) 'omo-manifest-ci'
          if (Test-Path $base) { Remove-Item -Recurse -Force $base }
          $artifacts = Join-Path $base 'artifacts'
          $out = Join-Path $base 'out'
          New-Item -ItemType Directory -Force -Path $artifacts | Out-Null
          Set-Content -LiteralPath (Join-Path $artifacts 'OMOPredict-lite-0.1.0-win-x64.zip') -Value 'stand-in package' -Encoding ASCII
          Set-Content -LiteralPath (Join-Path $artifacts 'omopredict-server.exe') -Value 'stand-in backend' -Encoding ASCII

          pwsh -NoProfile -File ./scripts/release-manifest.ps1 -InputDir $artifacts -OutDir $out -Version '0.1.0-ci'
          if ($LASTEXITCODE -ne 0) { throw "release-manifest.ps1 failed to generate (exit $LASTEXITCODE)" }
          if (-not (Test-Path (Join-Path $out 'SHA256SUMS.txt'))) { throw 'SHA256SUMS.txt was not written' }

          pwsh -NoProfile -File ./scripts/release-manifest.ps1 -Verify -InputDir $artifacts -Checksums (Join-Path $out 'SHA256SUMS.txt')
          if ($LASTEXITCODE -ne 0) { throw 'release-manifest.ps1 -Verify rejected a good manifest' }

          # 篡改一个字节后校验必须失败，否则"校验"没有意义
          Add-Content -LiteralPath (Join-Path $artifacts 'OMOPredict-lite-0.1.0-win-x64.zip') -Value 'tampered'
          pwsh -NoProfile -File ./scripts/release-manifest.ps1 -Verify -InputDir $artifacts -Checksums (Join-Path $out 'SHA256SUMS.txt')
          if ($LASTEXITCODE -ne 1) { throw "expected -Verify to fail on a tampered file, got $LASTEXITCODE" }
          exit 0

      # 完整路径：Go 构建 → 暂存 → 体积门禁 → 压缩（退出码 0）
      - name: Build lightweight package
        shell: pwsh
        run: |
          pwsh -NoProfile -File ./scripts/build-lite.ps1 -AllowMissingShell -SkipFrontendBuild -ShellDir packaging/stand-in-shell
          if ($LASTEXITCODE -ne 0) { throw "build-lite.ps1 failed with exit code $LASTEXITCODE" }

      # 体积门禁必须真的会拦（否则门禁形同虚设）。
      # 末尾的 exit 0 是必须的：GitHub 的 pwsh 包装器用最后的 $LASTEXITCODE 决定本步退出码，
      # 而我们刚刚**故意**让子进程退出 1 —— 不显式清零，这一步就会被判为失败。
      - name: Size gate must trip when the limit is lowered
        shell: pwsh
        run: |
          pwsh -NoProfile -File ./scripts/build-lite.ps1 -AllowMissingShell -SkipFrontendBuild -SkipGoBuild -ShellDir packaging/stand-in-shell -PayloadLimitMB 1
          if ($LASTEXITCODE -ne 1) { throw "expected the size gate to exit 1, got $LASTEXITCODE" }
          exit 0

      # T8 验收项"无 Python 错误路径"：没有可用引擎时必须退出 1 并给出可操作指引，
      # 而不是抛一段 PowerShell 堆栈。CI 上（未安装引擎）正好就是这个状态。
      # 同样以 exit 0 收尾：这一步期望子进程退出 1。
      - name: Engine error path must be actionable
        shell: pwsh
        run: |
          $output = pwsh -NoProfile -File ./scripts/setup-engine.ps1 -SkipInstall 2>&1 | Out-String
          if ($LASTEXITCODE -ne 1) { throw "expected setup-engine.ps1 to exit 1 without an engine, got $LASTEXITCODE" }
          if ($output -notmatch 'What to check') { throw "setup-engine.ps1 did not print the guidance block:`n$output" }
          exit 0

      # 调试 CLI 必须真的能跑通协议（上一步已产出 desktop/release/omopredict-server.exe）
      - name: rpc-cli smoke (ping over stdio)
        shell: pwsh
        run: |
          $output = pwsh -NoProfile -File ./scripts/rpc-cli.ps1 -Exe ./desktop/release/omopredict-server.exe -DataDir ./ci-data -Method ping 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0) { throw "rpc-cli.ps1 exited $LASTEXITCODE`n$output" }
          if ($output -notmatch '"status"\s*:\s*"ok"') { throw "rpc-cli.ps1 got no ping response:`n$output" }
          exit 0

      # 未知方法必须回保留错误码 -32601（协议层错误不能被吞掉）
      - name: rpc-cli surfaces unknown methods
        shell: pwsh
        run: |
          $output = pwsh -NoProfile -File ./scripts/rpc-cli.ps1 -Exe ./desktop/release/omopredict-server.exe -DataDir ./ci-data -Method no.such.method 2>&1 | Out-String
          if ($output -notmatch '\-32601') { throw "expected error code -32601:`n$output" }
          exit 0

  # 桌面打包的**输入**必须每天都被验证（T11 教训）。
  #
  # 为什么单独一个 Windows job：完整包的打包步骤一直没在 CI 里跑过，结果
  # `electron-builder` 连依赖都没声明、装上了又因上游版本缺陷直接崩 ——
  # 这些问题在本地用 -SkipPackaging 时全被绕开，直到真正发版才暴露（HANDOVER §6.45）。
  #
  # 这里跑 -SkipPackaging：渲染 → Go → PyInstaller sidecar → 壳 TS → 体积门禁，
  # 正是 release job 在 electron-builder 之前要做的全部事情。刻意**不跑** electron-builder，
  # 因为它要下载 ~100MB Electron 并执行安装器（无交互桌面会失败），放在 tag 触发的 release job
  # 里跑一次即可；本 job 的成本控制在可接受的几分钟内。
  desktop-package:
    name: Desktop package inputs (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "engine/uv.lock"

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install frontend deps
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      # --frozen-lockfile 同时验证：electron-builder 确实在依赖里、@electron/get 的 override
      # 已进锁文件（两者缺一都会在这里失败，而不是等到发版）。
      - name: Install desktop deps (lockfile must be complete)
        working-directory: desktop
        run: pnpm install --frozen-lockfile

      - name: electron-builder must be resolvable
        working-directory: desktop
        run: pnpm exec electron-builder --version

      - name: PyInstaller engine sidecar must contain no optional deps
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build-desktop.ps1 -SkipPackaging
          if ($LASTEXITCODE -ne 2) { throw "expected -SkipPackaging to exit 2 (staging only), got $LASTEXITCODE" }
          $leaks = @()
          foreach ($name in @('torch', 'fastapi', 'uvicorn', 'matplotlib')) {
            $hit = Get-ChildItem -Path desktop/release-bin -Recurse -Filter "*$name*" -ErrorAction SilentlyContinue
            if ($hit) { $leaks += $name }
          }
          if ($leaks.Count -gt 0) { throw ("engine sidecar leaks optional deps: " + ($leaks -join ', ')) }
          Write-Host 'engine sidecar is clean (no torch/fastapi/uvicorn/matplotlib)'
          Get-ChildItem -Path desktop/release-bin/omo-rpc -Filter 'omo-rpc.exe' -ErrorAction SilentlyContinue | ForEach-Object { Write-Host ("sidecar: {0}" -f $_.FullName) }

  # 发布 job（T9）：tag 触发，**在 Windows 上真打完整包**，连同轻量包与 SHA256 清单一起挂到 Release。
  #
  # 为什么必须是 windows-latest 而不是 ubuntu：
  #   - `build-lite.ps1` / `build-desktop.ps1` 里的 `go build` 不设 GOOS，产物是**宿主机**的；
  #     在 ubuntu 上把 Linux ELF 改名成 omopredict-server.exe，塞进名叫 "-win-x64" 的 zip。
  #   - 壳由 electron-builder 产出，而 electron-builder 的 Windows 目标（nsis/zip）需要 Windows 环境；
  #     ubuntu 上只能靠 wine，且 `desktop/package.json` 也没有 mac/linux 目标。
  #   - PyInstaller **不支持交叉编译**：引擎 sidecar 只能在目标平台上打。
  # 早期版本的 release job 在 ubuntu 上用"桩壳"（一个内容是一行文本的 OMOPredict.exe）打包，
  # 产物在任何机器上都跑不起来 —— 那等于发布一个假包。现在改为真打。
  #
  # 代价：Electron 下载 + PyInstaller(~40s) + electron-builder，单次约 5–8 分钟。
  release:
    name: Release (tag, windows)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write   # 创建 Release 并上传资产
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      # Python + uv 供 PyInstaller 打引擎 sidecar 用。
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "engine/uv.lock"

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 标签版本与包版本必须一致：build-lite.ps1 用 desktop/package.json 的 version 给 zip 命名，
      # 若两者漂移就会发出"标着 vX 却装着 Y"的包。这里提前拦掉。
      - name: Tag must match the packaged version
        run: |
          $tag = $env:GITHUB_REF_NAME -replace '^v', ''
          $pkg = (Get-Content ./desktop/package.json -Raw -Encoding UTF8 | ConvertFrom-Json).version
          Write-Host "tag=$tag package=$pkg"
          if ($tag -ne $pkg) {
            throw "tag '$env:GITHUB_REF_NAME' implies version '$tag' but desktop/package.json says '$pkg'; bump the version before tagging"
          }

      - name: Install frontend deps
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Install desktop deps
        working-directory: desktop
        run: pnpm install --frozen-lockfile

      # electron-builder 会自己下载所需 Electron；但 pnpm install 会跳过 electron 的 postinstall
      # （desktop/pnpm-workspace.yaml 的 allowBuilds），所以显式补齐，避免后续步骤依赖缺失。
      - name: Ensure Electron binary
        working-directory: desktop
        run: node node_modules/electron/install.js

      # 完整包：渲染 → Go（Windows 原生）→ PyInstaller sidecar → 壳 TS → electron-builder → 三道体积门禁。
      - name: Build full desktop package
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build-desktop.ps1
          if ($LASTEXITCODE -ne 0) { throw "build-desktop.ps1 failed with exit code $LASTEXITCODE" }

      # 轻量包：用**真实** electron-builder 产物（desktop/release/win-unpacked）当壳。
      # -OutDir 与 -ShellDir 必须分开给：-OutDir 一换位置，-ShellDir 若仍按默认推导就指向
      # <OutDir>/win-unpacked（不存在），结果只会打出一个没有壳的 staging。
      - name: Build lightweight package from the real shell
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build-lite.ps1 `
            -OutDir desktop/release/lite -ShellDir desktop/release/win-unpacked
          if ($LASTEXITCODE -ne 0) { throw "build-lite.ps1 failed with exit code $LASTEXITCODE" }

      - name: List what we built
        shell: powershell
        run: |
          foreach ($dir in @('desktop/release', 'desktop/release/lite')) {
            Write-Host "--- $dir ---"
            Get-ChildItem -LiteralPath $dir -File -ErrorAction SilentlyContinue |
              ForEach-Object { "{0,10:N1} MB  {1}" -f ($_.Length / 1MB), $_.Name }
          }

      # 清单覆盖"完整包（desktop/release 下 electron-builder 的产物）+ 轻量包（另一个目录）"，
      # 所以轻量 zip 用 -Include 显式带进来。
      - name: SHA256 manifest
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/release-manifest.ps1 `
            -InputDir desktop/release -OutDir dist/release -Include "desktop/release/lite/*.zip"
          if ($LASTEXITCODE -ne 0) { throw "release-manifest.ps1 failed with exit code $LASTEXITCODE" }

      # 清单必须能被同一条命令验回去：发布的校验说明也就是这一条。
      - name: Verify the manifest we are about to publish
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/release-manifest.ps1 `
            -Verify -Checksums dist/release/SHA256SUMS.txt -InputDir desktop/release -Include "desktop/release/lite/*.zip"
          if ($LASTEXITCODE -ne 0) { throw "the published manifest does not verify against its own artifacts" }

      - name: Record what is being published
        shell: powershell
        run: |
          $summary = '### Release assets' + "`n`n" +
            'Built on a Windows runner: the full desktop package (engine bundled), the lightweight ' +
            'package (user supplies Python) and the SHA256 manifest.' + "`n`n" +
            'Verify a download with:' + "`n`n" +
            '```' + "`n" +
            'powershell -File scripts/release-manifest.ps1 -Verify' + "`n" +
            '```'
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $summary

      - name: Publish release
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $assets = @(Get-ChildItem -Path 'desktop/release/*.exe','desktop/release/*.zip','desktop/release/lite/*.zip' -File -ErrorAction SilentlyContinue |
            ForEach-Object { $_.FullName })
          $assets += 'dist/release/SHA256SUMS.txt'
          $assets += @(Get-ChildItem -Path 'dist/release/omopredict-*.json' -File | ForEach-Object { $_.FullName })
          if ($assets.Count -eq 0) { throw 'no assets to publish' }
          Write-Host "publishing $($assets.Count) asset(s):"
          $assets | ForEach-Object { Write-Host "  $_" }
          gh release create $env:GITHUB_REF_NAME --title "OMOPredict $env:GITHUB_REF_NAME" --generate-notes @assets
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed with exit code $LASTEXITCODE" }
