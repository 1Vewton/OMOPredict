[project]
name = "omo"
version = "0.1.0"
description = "OMO 纳米多层薄膜轻量化仿真与设计软件 —— 数据科学层（物理仿真引擎）"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.2",
    "scipy>=1.18.1",
]

# 可选依赖（按形态安装；桌面引擎只需基础依赖，见 docs/desktop.md D4）：
#   api    —— HTTP 服务（FastAPI）与请求模型（pydantic）；Web/开发形态
#   neural —— NN 代理模型（torch）；桌面完整包会排除
#   plot   —— 对标报告绘图（matplotlib）
[project.optional-dependencies]
api = [
    "fastapi>=0.141.1",
    "pydantic>=2.0",
    "uvicorn[standard]>=0.52.4",
]
neural = ["torch>=2.13.0"]
plot = ["matplotlib>=3.11.1"]

[project.scripts]
omo-cli = "omo.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.16.4",
]

[tool.uv]
python-preference = "managed"

# PyTorch CPU 版（不含 CUDA 依赖，体积小）
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
